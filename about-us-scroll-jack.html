<script>
document.addEventListener('DOMContentLoaded', function () {
  if (document.body.classList.contains('sqs-edit-mode-active')) return;
  if (window.innerWidth <= 600) return;
  if (!window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;

  var sec1 = document.querySelector('section[data-section-id="6a7b1a77240b942222f5464f"]');
  var sec2 = document.querySelector('section[data-section-id="6ab117879e98ff097bf014ba"]');
  if (!sec1 || !sec2) return;

  var box = document.createElement('div');
  box.id = 'hscroll-box';
  var inner = document.createElement('div');
  inner.id = 'hscroll-inner';

  sec1.parentNode.insertBefore(box, sec1);
  box.appendChild(inner);
  inner.appendChild(sec1);
  inner.appendChild(sec2);

  var progress = 0;
  var maxScroll = 0;
  var released = null;

  function recalc() {
    maxScroll = inner.scrollWidth - box.clientWidth;
  }
  recalc();
  window.addEventListener('resize', recalc);

  function render() {
    inner.style.transform = 'translateX(-' + (progress * maxScroll) + 'px)';
  }

  window.addEventListener('wheel', function (e) {
    var rect = box.getBoundingClientRect();
    var visible = rect.top < window.innerHeight && rect.bottom > 0;
    if (!visible) {
      released = null;
      return;
    }

    var scrollingForward = e.deltaY > 0;

    if (released === 'forward' && scrollingForward) {
      e.preventDefault();
      return;
    }
    if (released === 'back' && !scrollingForward) {
      e.preventDefault();
      return;
    }
    if (released) released = null;

    var atEnd = progress >= 1;
    var atStart = progress <= 0;
    if ((scrollingForward && atEnd) || (!scrollingForward && atStart)) {
      released = scrollingForward ? 'forward' : 'back';
      e.preventDefault();
      if (scrollingForward) {
        window.scrollTo({ top: window.scrollY + rect.bottom, behavior: 'smooth' });
      } else {
        window.scrollTo({ top: window.scrollY + rect.top - window.innerHeight, behavior: 'smooth' });
      }
      return;
    }

    e.preventDefault();
    window.scrollTo(0, window.scrollY + rect.top);
    if (maxScroll > 0) {
      progress += e.deltaY / maxScroll;
      progress = Math.min(Math.max(progress, 0), 1);
      render();
    }
  }, { passive: false });
});
</script>
