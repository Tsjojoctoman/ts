<!--
  Adds a static "NOW" label to the homepage hero carousel
  (data-section-id="6a92cde6bbed3c398a6038e1"). Rendered as an actual
  <h1> so it automatically matches your site's real H1 font/size/weight
  from Site Styles, colored red (#E60F19). It sits fixed in place at the
  top-left of the section and does NOT change as the background images
  cycle through the carousel.
-->

<style>
section[data-section-id="6a92cde6bbed3c398a6038e1"] {
  position: relative;
}

#hero-now-label {
  position: absolute;
  left: var(--pagePadding, 24px);
  margin: 0;
  color: #E60F19;
  z-index: 10;
  pointer-events: none;
}
</style>

<script>
(function () {
  function init() {
    var section = document.querySelector('section[data-section-id="6a92cde6bbed3c398a6038e1"]');
    if (!section) return;
    if (document.getElementById('hero-now-label')) return;

    var label = document.createElement('h1');
    label.id = 'hero-now-label';
    label.textContent = 'NOW';
    section.appendChild(label);

    // The site's header is a "fixed header" style (floats over scrolling
    // content, confirmed via the tweak-fixed-header body class), so it
    // isn't part of normal document flow and the label needs its own
    // top offset computed from the header's actual live height, rather
    // than a hardcoded pixel value that would only be right at one
    // screen width.
    function positionBelowHeader() {
      var header = document.getElementById('header');
      var headerBottom = header ? header.getBoundingClientRect().bottom : 0;
      var sectionTop = section.getBoundingClientRect().top;
      // header.getBoundingClientRect() is viewport-relative, but the
      // label's "top" is relative to its offsetParent (the section), so
      // convert between the two coordinate spaces.
      label.style.top = (headerBottom - sectionTop) + 'px';
    }

    positionBelowHeader();
    window.addEventListener('resize', positionBelowHeader);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
