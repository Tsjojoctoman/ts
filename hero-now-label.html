<!-- Paste this whole block into Settings > Advanced > Code Injection > FOOTER -->
<!--
  Adds a static "NOW" label to the homepage hero carousel
  (data-section-id="6a92cde6bbed3c398a6038e1"). Rendered as an actual
  <h1> so it automatically matches your site's real H1 font/size/weight
  from Site Styles, colored red (#E60F19). It sits fixed in place at the
  top-left of the section and does NOT change as the background images
  cycle through the carousel.
-->

<style>
section[data-section-id="6a92cde6bbed3c398a6038e1"] {
  position: relative;
}

#hero-now-label {
  position: absolute;
  left: var(--pagePadding, 24px);
  margin: 0;
  color: #E60F19;
  z-index: 10;
  pointer-events: none;
}
</style>

<script>
(function () {
  function init() {
    if (document.body.classList.contains('sqs-edit-mode-active')) return;

    var section = document.querySelector('section[data-section-id="6a92cde6bbed3c398a6038e1"]');
    if (!section) return;
    if (document.getElementById('hero-now-label')) return;

    var label = document.createElement('h1');
    label.id = 'hero-now-label';
    label.textContent = 'NOW';
    section.appendChild(label);

    // The site's header is a "fixed header" style (floats over scrolling
    // content), so the label's top offset should just equal the header's
    // own height (the hero section is the first thing on the page, so
    // its natural top sits at document position 0). Deliberately NOT
    // using section.getBoundingClientRect().top here -- that's
    // viewport-relative and changes while scrolled, and on mobile the
    // address bar hiding/showing fires extra "resize" events mid-scroll,
    // which was recomputing the offset from a scrolled (wrong) position
    // and making the label visibly jump/drift.
    function positionBelowHeader() {
      var header = document.getElementById('header');
      var headerHeight = header ? header.getBoundingClientRect().height : 0;
      label.style.top = headerHeight + 'px';
    }

    positionBelowHeader();
    window.addEventListener('resize', positionBelowHeader);
    // The header (logo, nav, fonts) can take a moment to settle into
    // its final rendered height, especially in Squarespace's preview
    // mode -- re-checking once after full page load, and once more a
    // beat later as a safety net, catches cases where the very first
    // measurement ran before the header had actually reached its real
    // size, which was making the label land too low intermittently.
    window.addEventListener('load', positionBelowHeader);
    setTimeout(positionBelowHeader, 500);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
