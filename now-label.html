<script>
// Adds a real <h1>NOW</h1> as the first element inside the gallery
// section (data-section-id="6a92cde6bbed3c398a6038e1"), styled by
// now-label.css into the big red top-left label. Squarespace's editor
// won't let us type arbitrary markup into that section, so this
// inserts it at runtime instead.
//
// Paste into Settings > Advanced > Code Injection > HEADER, alongside
// now-label.css. Runs on DOMContentLoaded so it works even though
// header code executes before the page body exists yet.
(function () {
  function addNowLabel() {
    var section = document.querySelector(
      'section[data-section-id="6a92cde6bbed3c398a6038e1"]'
    );
    if (!section || section.querySelector('.now-label')) return;

    var h1 = document.createElement('h1');
    h1.className = 'now-label';
    h1.textContent = 'NOW';
    section.insertBefore(h1, section.firstChild);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', addNowLabel);
  } else {
    addNowLabel();
  }
})();
</script>
