<!-- Paste into Settings > Advanced > Code Injection > FOOTER (site-wide is
     fine -- it only activates on the Shop list page itself).

     Adds a sort bar above your Shop grid with: Featured (the manual order
     you set in the editor), Name A-Z / Z-A, Price Low-High / High-Low, and
     Newest / Oldest.

     SHOP_PATH is set to "/shopp" (confirmed from your product links, which
     are at /shopp/p/<slug> -- note the double "p" in "shopp") rather than
     the more obvious-looking "/shop". If your Shop page's actual address
     bar URL is different from that, change SHOP_PATH to match.

     Title, price, and date all come from the page's own ?format=json feed
     (same technique as related-content.html) rather than scraping visible
     text, so sorting works regardless of what each product card's markup
     looks like. Cards are matched to their JSON entry by data-product-id
     (confirmed present on your cards, e.g. data-product-id="6a5e336f...")
     which is more reliable than matching by link URL; falls back to the
     link URL if an id ever doesn't match.

     Confirmed from your DevTools markup: cards are
     ".product-list > .product-list-item" (lowercase -- a different, newer
     Squarespace commerce block than the classic ".ProductList-grid"
     naming), so that's now CARD_SELECTORS' first try, with the older
     patterns kept as fallbacks in case any other list page on the site
     uses a different template.

     Price still comes from the JSON product variant data first (checking
     a sale price before the regular one, since your cards can carry an
     "on-sale" class), and falls back to reading the visible price text off
     the card if the JSON shape doesn't match what's expected -- flagged
     the same way related-content.html flags its image field, since this
     hasn't been confirmed against your real price JSON yet. The DOM
     fallback matches £, $, or € amounts, since your shop uses GBP. -->

<style>
#shop-sort-bar {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 10px;
  max-width: 1200px;
  margin: 0 auto 24px;
  padding: 0 24px;
}
#shop-sort-bar label {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: #666;
}
#shop-sort-bar select {
  font-size: 14px;
  padding: 6px 10px;
  border: 1px solid #ccc;
  border-radius: 4px;
  background: #fff;
}
</style>

<script>
(function () {
  var SHOP_PATH = '/shopp'; // confirmed from your product link URLs -- edit if yours differs

  var CARD_SELECTORS = [
    '.product-list > .product-list-item', // confirmed from your DevTools markup
    '.ProductList-grid > *',   // classic Squarespace 7.1 product grid
    '.ProductList > .grid-item',
    '.grid-container > .grid-item' // 7.0-style summary/product grid
  ];

  function findCards() {
    for (var i = 0; i < CARD_SELECTORS.length; i++) {
      var cards = document.querySelectorAll(CARD_SELECTORS[i]);
      if (cards.length) {
        return { cards: Array.prototype.slice.call(cards), container: cards[0].parentElement };
      }
    }
    return null;
  }

  function cardId(card) {
    return card.getAttribute('data-product-id');
  }

  function cardHref(card) {
    var a = card.querySelector('a[href]');
    if (!a) return null;
    return a.getAttribute('href').split('?')[0].split('#')[0];
  }

  function domFallbackPrice(card) {
    var money = card.querySelector('.sqs-money-native');
    var text = money ? money.textContent : card.textContent;
    var match = text && text.match(/[£$€]?\s?[\d,]+\.?\d*/);
    return match ? parseFloat(match[0].replace(/[£$€,\s]/g, '')) : null;
  }

  function jsonPrice(item, card) {
    var onSale = item.onSale || (card.classList.contains('on-sale'));
    var variants = item.structuredContent && item.structuredContent.variants;
    if (variants && variants[0]) {
      var v = variants[0];
      if (onSale) {
        if (v.salePriceMoney && v.salePriceMoney.value != null) return parseFloat(v.salePriceMoney.value);
        if (typeof v.salePrice === 'number') return v.salePrice / 100;
      }
      if (v.priceMoney && v.priceMoney.value != null) return parseFloat(v.priceMoney.value);
      if (typeof v.price === 'number') return v.price / 100;
      if (typeof v.price === 'string') return parseFloat(v.price);
    }
    return domFallbackPrice(card);
  }

  function itemDate(item) {
    return item.publishOn || item.addedOn || item.updatedOn || 0;
  }

  function fetchJSON(url) {
    return fetch(url, { credentials: 'same-origin' })
      .then(function (res) { return res.ok ? res.json() : null; })
      .catch(function () { return null; });
  }

  function buildBar(onChange) {
    var bar = document.createElement('div');
    bar.id = 'shop-sort-bar';

    var label = document.createElement('label');
    label.setAttribute('for', 'shop-sort-select');
    label.textContent = 'Sort by';
    bar.appendChild(label);

    var select = document.createElement('select');
    select.id = 'shop-sort-select';
    [
      ['featured', 'Featured'],
      ['name-asc', 'Name: A to Z'],
      ['name-desc', 'Name: Z to A'],
      ['price-asc', 'Price: Low to High'],
      ['price-desc', 'Price: High to Low'],
      ['date-desc', 'Newest'],
      ['date-asc', 'Oldest']
    ].forEach(function (pair) {
      var opt = document.createElement('option');
      opt.value = pair[0];
      opt.textContent = pair[1];
      select.appendChild(opt);
    });

    var saved = null;
    try { saved = localStorage.getItem('shop-sort-pref'); } catch (e) {}
    if (saved) select.value = saved;

    select.addEventListener('change', function () {
      try { localStorage.setItem('shop-sort-pref', select.value); } catch (e) {}
      onChange(select.value);
    });

    bar.appendChild(select);
    return { bar: bar, select: select };
  }

  function init() {
    if (document.body.classList.contains('sqs-edit-mode-active')) return;
    if (window.location.pathname.replace(/\/$/, '') !== SHOP_PATH) return;

    var found = findCards();
    if (!found) return;

    fetchJSON(SHOP_PATH + '?format=json').then(function (data) {
      if (!data || !data.items) return;

      var byId = {};
      var byHref = {};
      data.items.forEach(function (item) {
        if (item.id) byId[item.id] = item;
        byHref[item.fullUrl] = item;
      });

      var originalOrder = found.cards.slice();
      var entries = found.cards.map(function (card) {
        var item = byId[cardId(card)] || byHref[cardHref(card)];
        return {
          card: card,
          title: item ? item.title : (card.textContent || ''),
          price: item ? jsonPrice(item, card) : domFallbackPrice(card),
          date: item ? itemDate(item) : 0
        };
      });

      function applySort(mode) {
        var ordered;
        if (mode === 'featured') {
          ordered = originalOrder;
        } else {
          var sorted = entries.slice();
          sorted.sort(function (a, b) {
            switch (mode) {
              case 'name-asc': return a.title.localeCompare(b.title);
              case 'name-desc': return b.title.localeCompare(a.title);
              case 'price-asc': return (a.price || 0) - (b.price || 0);
              case 'price-desc': return (b.price || 0) - (a.price || 0);
              case 'date-desc': return new Date(b.date) - new Date(a.date);
              case 'date-asc': return new Date(a.date) - new Date(b.date);
              default: return 0;
            }
          });
          ordered = sorted.map(function (e) { return e.card; });
        }

        var frag = document.createDocumentFragment();
        ordered.forEach(function (card) { frag.appendChild(card); });
        found.container.appendChild(frag);
      }

      var ui = buildBar(applySort);
      found.container.parentElement.insertBefore(ui.bar, found.container);
      applySort(ui.select.value);
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
