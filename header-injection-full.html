<script>
document.addEventListener('DOMContentLoaded', function () {
  if (document.body.classList.contains('sqs-edit-mode-active')) return;
  if (window.innerWidth <= 600) return;

  var sec1 = document.querySelector('section[data-section-id="6a7b1a77240b942222f5464f"]');
  var sec2 = document.querySelector('section[data-section-id="6ab117879e98ff097bf014ba"]');
  if (!sec1 || !sec2) return;

  // Remember exactly where these sections came from so we can put them
  // back if edit mode turns on later (see the MutationObserver below).
  var originalParent = sec1.parentNode;
  var originalNextSibling = sec1.nextSibling;

  var box = document.createElement('div');
  box.id = 'hscroll-box';
  var inner = document.createElement('div');
  inner.id = 'hscroll-inner';

  sec1.parentNode.insertBefore(box, sec1);
  box.appendChild(inner);
  inner.appendChild(sec1);
  inner.appendChild(sec2);

  // The edit-mode check above only runs once, at initial page load. If
  // the user starts on this page in normal view and *then* enters the
  // Squarespace editor without a full page reload, sqs-edit-mode-active
  // gets added to <body> after we've already reparented sec1/sec2 into
  // our own wrapper divs -- leaving the editor's own internal tracking
  // of the page structure out of sync with the real DOM, which crashes
  // it (NotFoundError: removeChild) the moment it tries to touch
  // anything near these sections. Watching for that class appearing and
  // undoing the reparenting immediately keeps the editor's expectations
  // intact.
  var reverted = false;
  function revertToOriginalPosition() {
    if (reverted) return;
    reverted = true;
    originalParent.insertBefore(sec1, originalNextSibling);
    originalParent.insertBefore(sec2, originalNextSibling);
    box.remove();
  }

  new MutationObserver(function () {
    if (document.body.classList.contains('sqs-edit-mode-active')) {
      revertToOriginalPosition();
    }
  }).observe(document.body, { attributes: true, attributeFilter: ['class'] });

  var progress = 0;
  var maxScroll = 0;

  function recalc() {
    maxScroll = inner.scrollWidth - box.clientWidth;
  }
  recalc();
  window.addEventListener('resize', recalc);

  function render() {
    inner.style.transform = 'translateX(-' + (progress * maxScroll) + 'px)';
  }

  // Once progress hits either end, this just stops intercepting scroll
  // entirely (returns false, no preventDefault) instead of firing a
  // manual scrollTo animation and blocking further input until it
  // finishes -- that hand-off was what caused the stutter/jump feeling.
  // Letting the browser's own native scroll take over exactly where we
  // left off gives a seamless, uninterrupted transition into normal
  // vertical scrolling for whatever section comes next.
  function handleDelta(deltaY, preventDefault) {
    if (reverted) return false;
    var rect = box.getBoundingClientRect();
    var visible = rect.top < window.innerHeight && rect.bottom > 0;
    if (!visible) return false;

    var scrollingForward = deltaY > 0;
    var atEnd = progress >= 1;
    var atStart = progress <= 0;

    if ((scrollingForward && atEnd) || (!scrollingForward && atStart)) {
      return false;
    }

    preventDefault();
    window.scrollTo(0, window.scrollY + rect.top);
    if (maxScroll > 0) {
      progress += deltaY / maxScroll;
      progress = Math.min(Math.max(progress, 0), 1);
      render();
    }
    return true;
  }

  window.addEventListener('wheel', function (e) {
    handleDelta(e.deltaY, function () { e.preventDefault(); });
  }, { passive: false });

  var touchY = null;
  window.addEventListener('touchstart', function (e) {
    touchY = e.touches[0].clientY;
  }, { passive: true });

  window.addEventListener('touchmove', function (e) {
    if (touchY === null) return;
    var currentY = e.touches[0].clientY;
    var deltaY = touchY - currentY;
    var handled = handleDelta(deltaY, function () { e.preventDefault(); });
    if (handled) {
      touchY = currentY;
    }
  }, { passive: false });

  window.addEventListener('touchend', function () {
    touchY = null;
  }, { passive: true });
});
</script>

<script>
(function () {
  function init() {
    if (document.body.classList.contains('sqs-edit-mode-active')) return;

    var section = document.querySelector('section[data-section-id="6ab503c517587b53ad577710"]');
    if (!section) return;

    // Measures every card's natural content height (title + date +
    // the reserved button padding, since padding-bottom still applies
    // with height:auto) and forces them all to match the tallest one,
    // so the position:absolute bottom-pinned button lands at the same
    // row height regardless of whether a title wraps to one or two
    // lines. Re-runs on resize/load and whenever the carousel's DOM
    // changes (e.g. Squarespace cloning slides for a looping carousel).
    function equalize() {
      var items = section.querySelectorAll('.list-item-content');
      if (!items.length) return;

      items.forEach(function (item) {
        item.style.removeProperty('height');
      });

      var max = 0;
      items.forEach(function (item) {
        if (item.scrollHeight > max) max = item.scrollHeight;
      });

      items.forEach(function (item) {
        item.style.setProperty('height', max + 'px', 'important');
      });
    }

    equalize();
    window.addEventListener('resize', equalize);
    window.addEventListener('load', equalize);

    var scheduled = false;
    new MutationObserver(function () {
      if (scheduled) return;
      scheduled = true;
      requestAnimationFrame(function () {
        scheduled = false;
        equalize();
      });
    }).observe(section, { childList: true, subtree: true });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
