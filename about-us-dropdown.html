<script>
// Make "ABOUT US" expand its dropdown in place instead of navigating to
// its own page (/about-1).
//
// Paste this into Settings > Advanced > Code Injection > HEADER (not
// Footer). Header code runs before Squarespace's own site script, so
// registering the listener here first — and calling
// stopImmediatePropagation() — blocks their navigation handler from
// running on this click.
//
// Rather than guessing at whatever native "+" toggle button exists,
// this directly shows/hides the sub-items container itself
// (.header-menu-nav-folder-content, confirmed from your Inspect
// screenshot earlier) by toggling its display style. No animation, but
// guaranteed to work regardless of what Squarespace's own toggle does
// internally.
(function () {
  document.addEventListener('click', function (e) {
    var link = e.target.closest('a[href*="/about-1"]');
    if (!link) return;

    e.preventDefault();
    e.stopPropagation();
    e.stopImmediatePropagation();

    var wrapper =
      link.closest('.header-menu-nav-folder-wrapper') ||
      link.closest('.header-menu-nav-folder') ||
      link.closest('.header-menu-nav-item');
    if (!wrapper) return;

    var content = wrapper.querySelector('.header-menu-nav-folder-content');
    if (!content) return;

    var isOpen = content.style.display === 'block';
    content.style.display = isOpen ? '' : 'block';

    var folder = wrapper.classList.contains('header-menu-nav-folder')
      ? wrapper
      : wrapper.querySelector('.header-menu-nav-folder');
    if (folder) {
      folder.classList.toggle('header-menu-nav-folder--active', !isOpen);
    }
  }, true);
})();
</script>
