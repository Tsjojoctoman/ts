<script>
// Make "ABOUT US" expand its dropdown in place instead of navigating to
// its own page (/about-1). Paste this whole block into
// Settings > Advanced > Code Injection > Footer (NOT Custom CSS).
//
// Runs in the "capturing" phase (the "true" at the end of addEventListener)
// so it intercepts the click BEFORE Squarespace's own navigation script
// gets a chance to run.
document.addEventListener('click', function (e) {
  var link = e.target.closest('a[href*="/about-1"]');
  if (!link) return;

  e.preventDefault();
  e.stopPropagation();

  var folder =
    link.closest('.header-menu-nav-folder') ||
    link.closest('.header-menu-nav-item');
  if (!folder) return;

  var toggle =
    folder.querySelector('.header-menu-nav-folder-toggle') ||
    folder.querySelector('button') ||
    folder.querySelector('[aria-expanded]');

  if (toggle && toggle !== link) {
    toggle.click();
  } else {
    folder.classList.toggle('header-menu-nav-folder--active');
  }
}, true);
</script>
