<script>
// Make "ABOUT US" expand its dropdown in place instead of navigating to
// its own page (/about-1).
//
// IMPORTANT: paste this into Settings > Advanced > Code Injection >
// HEADER this time (not Footer). Header code runs before Squarespace's
// own site script has a chance to attach its navigation click handler,
// so registering our delegated listener here first — and calling
// stopImmediatePropagation() — should fully block their handler from
// ever running on this click, regardless of how their router works
// internally.
//
// Using delegation (listening on document, checking e.target.closest)
// instead of grabbing a specific link reference also means this keeps
// working even if Squarespace re-renders the mobile menu's markup later.
(function () {
  document.addEventListener('click', function (e) {
    var link = e.target.closest('a[href*="/about-1"]');
    if (!link) return;

    e.preventDefault();
    e.stopPropagation();
    e.stopImmediatePropagation();

    var folder =
      link.closest('.header-menu-nav-folder') ||
      link.closest('.header-menu-nav-item');
    if (!folder) return;

    var toggle =
      folder.querySelector('.header-menu-nav-folder-toggle') ||
      folder.querySelector('button') ||
      folder.querySelector('[aria-expanded]');

    if (toggle && toggle !== link) {
      toggle.click();
    } else {
      folder.classList.toggle('header-menu-nav-folder--active');
    }
  }, true);
})();
</script>
