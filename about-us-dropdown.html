<script>
// Make "ABOUT US" expand its dropdown in place instead of navigating to
// its own page (/about-1). Paste this whole block into
// Settings > Advanced > Code Injection > Footer (NOT Custom CSS).
//
// Instead of trying to out-race Squarespace's own click handler (which
// loses if their script attaches its listener first), this removes the
// link's href entirely on page load — so there is nothing for
// Squarespace's router to navigate to, no matter which script's click
// handler runs first.
document.addEventListener('DOMContentLoaded', function () {
  var link = document.querySelector('a[href*="/about-1"]');
  if (!link) return;

  link.removeAttribute('href');
  link.style.cursor = 'pointer';

  var folder =
    link.closest('.header-menu-nav-folder') ||
    link.closest('.header-menu-nav-item');

  link.addEventListener('click', function (e) {
    e.preventDefault();
    if (!folder) return;

    var toggle =
      folder.querySelector('.header-menu-nav-folder-toggle') ||
      folder.querySelector('button') ||
      folder.querySelector('[aria-expanded]');

    if (toggle && toggle !== link) {
      toggle.click();
    } else {
      folder.classList.toggle('header-menu-nav-folder--active');
    }
  });
});
</script>
