<!--
  On the blog list section (data-section-id="6aa80c05866d1f24313a8193"),
  hides your custom square cursor (defined in custom-cursor.css) and shows
  plain white "READ" text following the mouse instead, but ONLY while the
  mouse is exactly over a post's image (.user-items-list-carousel__media-
  container), not the title/description/rest of the card.
-->

<style>
#well-read-label {
  position: fixed;
  top: 0;
  left: 0;
  transform: translate(-50%, -50%);
  z-index: 9999;
  pointer-events: none;
  opacity: 0;
  margin: 0;
  color: #ffffff;
  white-space: nowrap;
  transition: opacity 0.15s ease;
}

/* Hides the site-wide square cursor (custom-cursor.css) while the mouse
   is over a blog list image, so only the READ label shows. Matched
   specificity to custom-cursor.css's rules plus one extra class, so it
   wins the cascade. */
body.well-read-hover:not(.sqs-edit-mode-active),
body.well-read-hover:not(.sqs-edit-mode-active) * {
  cursor: none !important;
}

/* Zooms the photo itself inside its fixed-size frame on hover — the
   card/box never resizes, only the image content scales and crops
   tighter, clipped by the frame's own overflow:hidden. */
section[data-section-id="6aa80c05866d1f24313a8193"] .user-items-list-carousel__media-inner {
  overflow: hidden;
}

section[data-section-id="6aa80c05866d1f24313a8193"] .user-items-list-carousel__media {
  transition: transform 0.4s ease;
}

section[data-section-id="6aa80c05866d1f24313a8193"] .user-items-list-carousel__media-container.well-read-image-hover .user-items-list-carousel__media {
  transform: scale(1.08);
}
</style>

<script>
(function () {
  function init() {
    if (document.body.classList.contains('sqs-edit-mode-active')) return;
    if (!window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;

    // Uses an actual <h4> tag (not a div) so it automatically picks up
    // whatever font/size/weight/letter-spacing/transform your theme
    // applies to h4 headings in Site Styles, instead of a hardcoded font.
    var label = document.createElement('h4');
    label.id = 'well-read-label';
    label.textContent = 'READ';
    document.body.appendChild(label);

    // Uses plain bounding-box math instead of document.elementFromPoint().
    // The carousel's slide items go through an entrance/reveal animation
    // (list-item-basic-animation) that leaves them with pointer-events:
    // none, so elementFromPoint() never actually resolves to the image —
    // it hits the <ul> wrapper instead. Checking whether the cursor
    // coordinates fall inside each container's rect sidesteps that
    // entirely. Queried fresh on every mousemove (not cached) so this
    // keeps working across Squarespace's AJAX page transitions too.
    function imageUnderPoint(x, y) {
      var section = document.querySelector('section[data-section-id="6aa80c05866d1f24313a8193"]');
      if (!section) return null;

      var containers = section.querySelectorAll('.user-items-list-carousel__media-container');
      for (var i = 0; i < containers.length; i++) {
        var r = containers[i].getBoundingClientRect();
        if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) {
          return containers[i];
        }
      }
      return null;
    }

    // Uses the same bounding-box approach as imageUnderPoint(), rather
    // than elementFromPoint(), because elementFromPoint() depends on the
    // overlay's pointer-events being active — which is unreliable mid-
    // animation while the nav is opening/closing (e.g. navigating back
    // from a blog post), causing READ to flash through briefly. Checking
    // the overlay's own rect instead doesn't depend on that timing.
    function isNavOpen(x, y) {
      var overlay = document.querySelector('.header-menu, [data-test="header-menu"]');
      if (!overlay) return false;

      var r = overlay.getBoundingClientRect();
      if (r.width === 0 || r.height === 0) return false;

      return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
    }

    var currentHovered = null;

    document.addEventListener('mousemove', function (e) {
      var hovered = isNavOpen(e.clientX, e.clientY) ? null : imageUnderPoint(e.clientX, e.clientY);

      if (hovered !== currentHovered) {
        if (currentHovered) currentHovered.classList.remove('well-read-image-hover');
        if (hovered) hovered.classList.add('well-read-image-hover');
        currentHovered = hovered;
      }

      document.body.classList.toggle('well-read-hover', !!hovered);
      label.style.opacity = hovered ? '1' : '0';
      label.style.left = e.clientX + 'px';
      label.style.top = e.clientY + 'px';
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
