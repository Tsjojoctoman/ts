<template id="ts-search-link-template">
  <a href="/search" class="ts-search-link" aria-label="Search">
    <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="7"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
  </a>
</template>

<script>
(function () {
  var template = document.getElementById('ts-search-link-template');

  document.querySelectorAll('.header-actions').forEach(function (actions) {
    // Find the cart icon (or whatever's already in this container)
    // BEFORE we insert our own, so we copy its real size/spacing.
    var existingSvg = actions.querySelector('svg');
    var existingLink = existingSvg ? existingSvg.closest('a') : null;

    var clone = template.content.cloneNode(true);
    var ourLink = clone.querySelector('.ts-search-link');
    var ourSvg = ourLink.querySelector('svg');

    if (existingSvg) {
      var svgRect = existingSvg.getBoundingClientRect();
      if (svgRect.width && svgRect.height) {
        ourSvg.setAttribute('width', svgRect.width);
        ourSvg.setAttribute('height', svgRect.height);
      }
    }
    if (existingLink) {
      var cs = getComputedStyle(existingLink);
      ourLink.style.display = 'inline-flex';
      ourLink.style.alignItems = 'center';
      ourLink.style.padding = cs.padding;
      ourLink.style.margin = cs.margin;
    } else {
      // Fallback if nothing else is in the container yet
      ourLink.style.display = 'inline-flex';
      ourLink.style.alignItems = 'center';
      ourLink.style.padding = '6px';
    }
    // Extra breathing room before the cart icon — adjust this value if
    // you want more/less gap.
    ourLink.style.marginRight = '15px';

    actions.insertBefore(clone, actions.firstChild);
  });
})();
</script>
