<script>
// EDIT THESE TWO LISTS:

// 1. Collection pages to pull individual items from automatically
//    (every book/episode/product/event inside them becomes searchable).
//    Check Pages panel / your address bar for the real URL of each.
window.TS_COLLECTION_PAGES = [
  "/shop",
  "/audiobooks",
  "/podcasts",
  "/events"
  // add more collection pages here, e.g. "/blog"
];

// 2. Regular (non-collection) pages to include as-is.
window.TS_STATIC_PAGES = [
  { title: "About Manifesto", url: "/about-manifesto" },
  { title: "Our Authors", url: "/our-authors" },
  { title: "Join Us", url: "/join-us" }
  // add more like this: { title: "Page Name", url: "/page-url" },
];
</script>

<button id="ts-search-toggle" aria-label="Open search" aria-expanded="false">
  <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="11" cy="11" r="7"></circle>
    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
  </svg>
</button>

<div id="ts-search-panel">
  <form id="ts-search-form">
    <input type="text" id="ts-search-input" placeholder="Search…" autocomplete="off" />
    <button type="submit" aria-label="Submit search">Go</button>
  </form>
  <div id="ts-search-results"></div>
</div>

<style>
  #ts-search-toggle {
    background: none;
    border: none;
    padding: 6px;
    cursor: pointer;
    line-height: 0;
    display: inline-flex;
    align-items: center;
  }
  #ts-search-panel {
    position: fixed;
    top: var(--header-height, 90px);
    left: 0;
    right: 0;
    background: #ffffff;
    padding: 20px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    opacity: 0;
    visibility: hidden;
    transform: translateY(-10px);
    transition: opacity 200ms ease, transform 200ms ease, visibility 200ms;
    z-index: 999;
    max-height: 80vh;
    overflow-y: auto;
  }
  #ts-search-panel.ts-open {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }
  #ts-search-form {
    display: flex;
    max-width: 600px;
    margin: 0 auto;
    gap: 8px;
  }
  #ts-search-input {
    flex: 1;
    padding: 10px 14px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 4px;
  }
  #ts-search-form button[type="submit"] {
    padding: 10px 16px;
    border: none;
    background: #E60F19;
    color: #ffffff;
    border-radius: 4px;
    cursor: pointer;
  }
  #ts-search-results {
    max-width: 600px;
    margin: 12px auto 0;
  }
  #ts-search-results a {
    display: block;
    padding: 10px 4px;
    border-bottom: 1px solid #eee;
    color: #111;
    text-decoration: none;
  }
  #ts-search-results a:hover {
    background: #f7f7f7;
  }
  #ts-search-results .ts-empty {
    padding: 10px 4px;
    color: #777;
  }
</style>

<script>
(function () {
  var toggle = document.getElementById('ts-search-toggle');
  var panel = document.getElementById('ts-search-panel');
  var input = document.getElementById('ts-search-input');
  var form = document.getElementById('ts-search-form');
  var resultsEl = document.getElementById('ts-search-results');

  var searchIndex = (window.TS_STATIC_PAGES || []).slice();
  var indexLoaded = false;
  var indexLoadingPromise = null;

  var actions = document.querySelector('.header-actions');
  if (actions) {
    actions.insertBefore(toggle, actions.firstChild);
  }

  toggle.addEventListener('click', function () {
    var isOpen = panel.classList.toggle('ts-open');
    toggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    if (isOpen) {
      setTimeout(function () { input.focus(); }, 260);
      loadCollectionsOnce();
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      panel.classList.remove('ts-open');
      toggle.setAttribute('aria-expanded', 'false');
    }
  });

  form.addEventListener('submit', function (e) { e.preventDefault(); });

  input.addEventListener('input', function () {
    runSearch(input.value);
  });

  // Fetches each collection page ONCE (the first time the panel opens),
  // pulls every item's title + link out of it, and adds them to the
  // search index. Cached after that — no repeated network requests.
  function loadCollectionsOnce() {
    if (indexLoadingPromise) return indexLoadingPromise;

    var pages = window.TS_COLLECTION_PAGES || [];
    if (!pages.length) {
      indexLoaded = true;
      return Promise.resolve();
    }

    resultsEl.innerHTML = input.value.trim()
      ? '<div class="ts-empty">Loading…</div>'
      : '';

    indexLoadingPromise = Promise.all(
      pages.map(function (pageUrl) {
        return fetch(pageUrl + '?format=json')
          .then(function (res) { return res.ok ? res.json() : null; })
          .then(function (data) {
            if (!data || !Array.isArray(data.items)) return;
            data.items.forEach(function (item) {
              if (!item || !item.title) return;
              searchIndex.push({
                title: item.title,
                url: item.fullUrl || (pageUrl + '/' + item.urlId)
              });
            });
          })
          .catch(function (err) {
            console.error('Could not load collection', pageUrl, err);
          });
      })
    ).then(function () {
      indexLoaded = true;
      runSearch(input.value);
    });

    return indexLoadingPromise;
  }

  function runSearch(query) {
    query = (query || '').trim().toLowerCase();
    if (!query) {
      resultsEl.innerHTML = '';
      return;
    }
    if (!indexLoaded) {
      resultsEl.innerHTML = '<div class="ts-empty">Loading…</div>';
      return;
    }
    var matches = searchIndex.filter(function (item) {
      return item.title.toLowerCase().indexOf(query) !== -1;
    });
    renderResults(matches);
  }

  function renderResults(items) {
    if (!items.length) {
      resultsEl.innerHTML = '<div class="ts-empty">No matches.</div>';
      return;
    }
    var html = items.slice(0, 20).map(function (item) {
      return '<a href="' + item.url + '">' + item.title + '</a>';
    }).join('');
    resultsEl.innerHTML = html;
  }
})();
</script>
