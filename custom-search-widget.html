<!-- Paste this whole block into Settings > Advanced > Code Injection > FOOTER -->

<button id="ts-search-toggle" aria-label="Open search" aria-expanded="false">
  <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="11" cy="11" r="7"></circle>
    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
  </svg>
</button>

<div id="ts-search-panel">
  <form action="/search" method="get" id="ts-search-form">
    <input type="text" name="query" id="ts-search-input" placeholder="Search…" autocomplete="off" />
    <button type="submit" aria-label="Submit search">Go</button>
  </form>
  <div id="ts-search-results"></div>
</div>

<style>
  #ts-search-toggle {
    background: none;
    border: none;
    padding: 6px;
    cursor: pointer;
    line-height: 0;
    display: inline-flex;
    align-items: center;
  }
  #ts-search-panel {
    position: fixed;
    top: var(--header-height, 90px);
    left: 0;
    right: 0;
    background: #ffffff;
    padding: 20px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    opacity: 0;
    visibility: hidden;
    transform: translateY(-10px);
    transition: opacity 200ms ease, transform 200ms ease, visibility 200ms;
    z-index: 999;
    max-height: 80vh;
    overflow-y: auto;
  }
  #ts-search-panel.ts-open {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }
  #ts-search-form {
    display: flex;
    max-width: 600px;
    margin: 0 auto;
    gap: 8px;
  }
  #ts-search-input {
    flex: 1;
    padding: 10px 14px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 4px;
  }
  #ts-search-form button[type="submit"] {
    padding: 10px 16px;
    border: none;
    background: #E60F19;
    color: #ffffff;
    border-radius: 4px;
    cursor: pointer;
  }
  #ts-search-results {
    max-width: 600px;
    margin: 12px auto 0;
  }
  #ts-search-results a {
    display: block;
    padding: 10px 4px;
    border-bottom: 1px solid #eee;
    color: #111;
    text-decoration: none;
  }
  #ts-search-results a:hover {
    background: #f7f7f7;
  }
  #ts-search-results .ts-empty,
  #ts-search-results .ts-error {
    padding: 10px 4px;
    color: #777;
  }
</style>

<script>
(function () {
  var toggle = document.getElementById('ts-search-toggle');
  var panel = document.getElementById('ts-search-panel');
  var input = document.getElementById('ts-search-input');
  var form = document.getElementById('ts-search-form');
  var resultsEl = document.getElementById('ts-search-results');
  var currentQuery = '';

  var actions = document.querySelector('.header-actions');
  if (actions) {
    actions.insertBefore(toggle, actions.firstChild);
  }

  toggle.addEventListener('click', function () {
    var isOpen = panel.classList.toggle('ts-open');
    toggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    if (isOpen) {
      setTimeout(function () { input.focus(); }, 260);
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      panel.classList.remove('ts-open');
      toggle.setAttribute('aria-expanded', 'false');
    }
  });

  // Stop the form from ever doing a real page navigation. Search only
  // fires on submit (Enter / "Go") now, not on every keystroke — typing
  // live was firing a request per character and tripping Squarespace's
  // rate limit (429), which is why results were failing to load.
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    runSearch(input.value);
  });

  function runSearch(query) {
    query = (query || '').trim();
    currentQuery = query;
    if (!query) {
      resultsEl.innerHTML = '';
      return;
    }
    resultsEl.innerHTML = '<div class="ts-empty">Searching…</div>';

    fetch('/search?format=json&query=' + encodeURIComponent(query))
      .then(function (res) {
        if (res.status === 429) {
          throw new Error('rate-limited');
        }
        return res.json();
      })
      .then(function (data) {
        // Only render if this response matches the latest thing typed
        // (avoids an older, slower response overwriting a newer one).
        if (query !== currentQuery) return;
        renderResults(extractItems(data), query);
      })
      .catch(function (err) {
        if (query !== currentQuery) return;
        console.error('Search request failed:', err);
        var message = err && err.message === 'rate-limited'
          ? 'Too many searches too quickly — wait a few seconds and try again.'
          : 'Search results could not be loaded. Press Enter to try the full search page instead.';
        resultsEl.innerHTML = '<div class="ts-error">' + message + '</div>';
      });
  }

  // Squarespace's JSON search response shape isn't officially
  // documented and can vary by template — this tries a few common
  // locations for the results array.
  function extractItems(data) {
    if (!data) return [];
    if (Array.isArray(data.items)) return data.items;
    if (data.pages && Array.isArray(data.pages.items)) return data.pages.items;
    if (data.result && Array.isArray(data.result.items)) return data.result.items;
    return [];
  }

  function renderResults(items, query) {
    if (!items.length) {
      resultsEl.innerHTML =
        '<div class="ts-empty">No instant results. Press Enter to see the full search page.</div>';
      return;
    }
    var html = items.slice(0, 8).map(function (item) {
      var title = item.title || item.name || 'Untitled';
      var url = item.fullUrl || item.url || '#';
      return '<a href="' + url + '">' + title + '</a>';
    }).join('');
    resultsEl.innerHTML = html;
  }
})();
</script>
