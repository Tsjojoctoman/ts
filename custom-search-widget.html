<!--
  EDIT THIS LIST: add/remove/fix entries for every page you want
  searchable. title = what shows in results, url = the page's actual
  URL (check Pages panel or your address bar for the real slug).
-->
<script>
window.TS_SEARCH_INDEX = [
  { title: "Podcasts", url: "/podcasts" },
  { title: "Shop", url: "/shop" },
  { title: "Audiobooks", url: "/audiobooks" },
  { title: "Events", url: "/events" },
  { title: "About Manifesto", url: "/about-manifesto" },
  { title: "Our Authors", url: "/our-authors" },
  { title: "Join Us", url: "/join-us" }
  // Add more like this:
  // { title: "Page Name", url: "/page-url" },
];
</script>

<button id="ts-search-toggle" aria-label="Open search" aria-expanded="false">
  <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="11" cy="11" r="7"></circle>
    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
  </svg>
</button>

<div id="ts-search-panel">
  <form id="ts-search-form">
    <input type="text" id="ts-search-input" placeholder="Search…" autocomplete="off" />
    <button type="submit" aria-label="Submit search">Go</button>
  </form>
  <div id="ts-search-results"></div>
</div>

<style>
  #ts-search-toggle {
    background: none;
    border: none;
    padding: 6px;
    cursor: pointer;
    line-height: 0;
    display: inline-flex;
    align-items: center;
  }
  #ts-search-panel {
    position: fixed;
    top: var(--header-height, 90px);
    left: 0;
    right: 0;
    background: #ffffff;
    padding: 20px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    opacity: 0;
    visibility: hidden;
    transform: translateY(-10px);
    transition: opacity 200ms ease, transform 200ms ease, visibility 200ms;
    z-index: 999;
    max-height: 80vh;
    overflow-y: auto;
  }
  #ts-search-panel.ts-open {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }
  #ts-search-form {
    display: flex;
    max-width: 600px;
    margin: 0 auto;
    gap: 8px;
  }
  #ts-search-input {
    flex: 1;
    padding: 10px 14px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 4px;
  }
  #ts-search-form button[type="submit"] {
    padding: 10px 16px;
    border: none;
    background: #E60F19;
    color: #ffffff;
    border-radius: 4px;
    cursor: pointer;
  }
  #ts-search-results {
    max-width: 600px;
    margin: 12px auto 0;
  }
  #ts-search-results a {
    display: block;
    padding: 10px 4px;
    border-bottom: 1px solid #eee;
    color: #111;
    text-decoration: none;
  }
  #ts-search-results a:hover {
    background: #f7f7f7;
  }
  #ts-search-results .ts-empty {
    padding: 10px 4px;
    color: #777;
  }
</style>

<script>
(function () {
  var toggle = document.getElementById('ts-search-toggle');
  var panel = document.getElementById('ts-search-panel');
  var input = document.getElementById('ts-search-input');
  var form = document.getElementById('ts-search-form');
  var resultsEl = document.getElementById('ts-search-results');
  var index = window.TS_SEARCH_INDEX || [];

  var actions = document.querySelector('.header-actions');
  if (actions) {
    actions.insertBefore(toggle, actions.firstChild);
  }

  toggle.addEventListener('click', function () {
    var isOpen = panel.classList.toggle('ts-open');
    toggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    if (isOpen) {
      setTimeout(function () { input.focus(); }, 260);
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      panel.classList.remove('ts-open');
      toggle.setAttribute('aria-expanded', 'false');
    }
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
  });

  // Client-side only — no network request, so no rate limit issue and
  // safe to filter on every keystroke.
  input.addEventListener('input', function () {
    runSearch(input.value);
  });

  function runSearch(query) {
    query = (query || '').trim().toLowerCase();
    if (!query) {
      resultsEl.innerHTML = '';
      return;
    }
    var matches = index.filter(function (item) {
      return item.title.toLowerCase().indexOf(query) !== -1;
    });
    renderResults(matches);
  }

  function renderResults(items) {
    if (!items.length) {
      resultsEl.innerHTML = '<div class="ts-empty">No matches.</div>';
      return;
    }
    var html = items.map(function (item) {
      return '<a href="' + item.url + '">' + item.title + '</a>';
    }).join('');
    resultsEl.innerHTML = html;
  }
})();
</script>
